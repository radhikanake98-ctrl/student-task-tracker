<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Task Tracker</h1>
    <p>Manage your daily college tasks</p>
    <h2>Add a task</h2>
    <input type="text" id="taskInput" placeholder="Enter your task">
    <button id="addTaskButton">Add task</button>
    <h2>My Tasks</h2>
    <p id="taskCounter">Total:0 | Completed:0 | Pending:0</p>
    <button id="allButton">All</button>
    <button id="pendingButton">Pending</button>
    <button id="completedButton">Completed</button> 
    <ul id="taskList">
        <li>Complete Digital electronics assignment</li>
        <li>Practice javascript</li>    
    </ul>
    <script src="script.js"></script>
</body>
</html>
